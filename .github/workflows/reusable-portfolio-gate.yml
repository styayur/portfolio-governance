name: Portfolio Evidence Gate

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      central_sha:
        required: true
        type: string
    secrets:
      PORTFOLIO_AI_REVIEW_API_KEY:
        required: false

permissions:
  actions: read
  checks: write
  contents: write
  issues: write
  pull-requests: write
  security-events: read
  statuses: read

concurrency:
  group: portfolio-gate-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Portfolio Evidence Gate / provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate protected evaluator before any checkout or installation
        env:
          GH_TOKEN: ${{ github.token }}
          CENTRAL_SHA: ${{ inputs.central_sha }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          EXPECTED_BASE: ${{ inputs.base_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          def validate(env, read):
              for key in ['CENTRAL_SHA', 'EXPECTED_HEAD', 'EXPECTED_BASE']:
                  if not re.fullmatch('[0-9a-f]{40}', env[key]):
                      raise ValueError('invalid immutable SHA input')
              if not env['PR_NUMBER'].isdigit() or int(env['PR_NUMBER']) < 1:
                  raise ValueError('invalid PR number')
              if env['GITHUB_EVENT_NAME'] not in {'pull_request_target', 'workflow_dispatch'}:
                  raise ValueError('caller event is not a protected-base or explicit owner dispatch')
              if env['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and (
                  env['GITHUB_ACTOR_ID'] != '324560549' or env['GITHUB_RUN_ATTEMPT'] != '1'
              ):
                  raise ValueError('dispatch is not the owner first attempt')
              repo = env['GITHUB_REPOSITORY']
              if not re.fullmatch(r'styayur/[A-Za-z0-9_.-]+', repo) or repo.casefold() == 'styayur/site':
                  raise ValueError('repository outside public portfolio scope')
              target = read('repos/' + repo)
              if target.get('private') is not False or target.get('full_name') != repo:
                  raise ValueError('target public repository identity mismatch')
              root = read('repos/styayur/portfolio-governance')
              if root.get('id') != 1449400406 or root.get('private') is not False or root.get('full_name') != 'styayur/portfolio-governance' or root.get('default_branch') != 'main':
                  raise ValueError('trust root repository identity mismatch')
              run = read('repos/' + repo + '/actions/runs/' + env['GITHUB_RUN_ID'])
              if str(run.get('id')) != env['GITHUB_RUN_ID'] or (run.get('repository') or {}).get('id') != target.get('id'):
                  raise ValueError('workflow run repository identity mismatch')
              prefix = 'styayur/portfolio-governance/.github/workflows/reusable-portfolio-gate.yml@'
              refs = [r for r in run.get('referenced_workflows', []) if str(r.get('path', '')).startswith(prefix)]
              sha = env['CENTRAL_SHA']
              if len(refs) != 1 or refs[0].get('path') != prefix + sha or refs[0].get('sha') != sha:
                  raise ValueError('executing callee and script revision do not match')
              comparison = read('repos/styayur/portfolio-governance/compare/' + sha + '...main')
              if comparison.get('status') not in {'ahead', 'identical'} or (comparison.get('base_commit') or {}).get('sha') != sha or (comparison.get('merge_base_commit') or {}).get('sha') != sha:
                  raise ValueError('evaluator is not in protected main history')

          def read(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))

          if __name__ == '__main__':
              validate(os.environ, read)
              print('Verified exact public protected evaluator provenance before checkout.')
          PY

  classify:
    name: Portfolio Evidence Gate / risk
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: styayur/portfolio-governance
          ref: ${{ inputs.central_sha }}
          path: governance
          persist-credentials: false
      - name: Classify pull request risk from exact diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 governance/scripts/risk_classify.py
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr_number }}"
          --context "$RUNNER_TEMP/pr-context.json"
          --output "$RUNNER_TEMP/risk.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: risk-evidence
          path: |
            ${{ runner.temp }}/pr-context.json
            ${{ runner.temp }}/risk.json
          if-no-files-found: error
          retention-days: 30

  review:
    name: Portfolio Evidence Gate / review
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: styayur/portfolio-governance
          ref: ${{ inputs.central_sha }}
          path: governance
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned safe YAML parser
        run: >-
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps
          -r governance/automation/bootstrap/review-requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: risk-evidence
          path: ${{ runner.temp }}/risk
      - name: Run static independent policy review
        run: >-
          python3 governance/scripts/independent_review.py
          --context "$RUNNER_TEMP/risk/pr-context.json"
          --risk "$RUNNER_TEMP/risk/risk.json"
          --output "$RUNNER_TEMP/review.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: independent-review
          path: ${{ runner.temp }}/review.json
          if-no-files-found: error
          retention-days: 30

  ai-review:
    name: Portfolio Evidence Gate / ai-review
    needs: [classify, review]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: styayur/portfolio-governance
          ref: ${{ inputs.central_sha }}
          path: governance
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: risk-evidence
          path: ${{ runner.temp }}/risk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: independent-review
          path: ${{ runner.temp }}/review
      - name: Run independent AI review adapter
        env:
          PORTFOLIO_AI_REVIEW_ENABLED: ${{ vars.PORTFOLIO_AI_REVIEW_ENABLED }}
          PORTFOLIO_AI_REVIEW_ENDPOINT: ${{ vars.PORTFOLIO_AI_REVIEW_ENDPOINT }}
          PORTFOLIO_AI_REVIEW_MODEL: ${{ vars.PORTFOLIO_AI_REVIEW_MODEL }}
          PORTFOLIO_AI_REVIEW_API_KEY: ${{ secrets.PORTFOLIO_AI_REVIEW_API_KEY }}
        run: >-
          python3 governance/scripts/ai_review_adapter.py
          --context "$RUNNER_TEMP/risk/pr-context.json"
          --risk "$RUNNER_TEMP/risk/risk.json"
          --static-review "$RUNNER_TEMP/review/review.json"
          --output "$RUNNER_TEMP/ai-review.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ai-review
          path: ${{ runner.temp }}/ai-review.json
          if-no-files-found: error
          retention-days: 30

  evidence:
    name: Portfolio Evidence Gate / verify
    needs: [classify, review, ai-review]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
      security-events: read
      statuses: read
    outputs:
      merge_eligible: ${{ steps.eligibility.outputs.merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: styayur/portfolio-governance
          ref: ${{ inputs.central_sha }}
          path: governance
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: risk-evidence
          path: ${{ runner.temp }}/risk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: independent-review
          path: ${{ runner.temp }}/review
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ai-review
          path: ${{ runner.temp }}/ai-review
      - name: Evaluate authenticated manual approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 governance/scripts/manual_approval.py
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr_number }}"
          --risk "$RUNNER_TEMP/risk/risk.json"
          --config governance/policy/manual-approval.v1.json
          --output "$RUNNER_TEMP/manual-approval.json"
      - name: Verify exact head and apply merge policy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_TIMEOUT_SECONDS: '2700'
          GATE_POLL_SECONDS: '15'
        run: >-
          python3 governance/scripts/evidence_gate.py
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr_number }}"
          --head-sha "${{ inputs.head_sha }}"
          --base-sha "${{ inputs.base_sha }}"
          --risk "$RUNNER_TEMP/risk/risk.json"
          --review "$RUNNER_TEMP/review/review.json"
          --ai-review "$RUNNER_TEMP/ai-review/ai-review.json"
          --manual-approval "$RUNNER_TEMP/manual-approval.json"
          --matrix governance/policy/evidence-matrix.v1.json
          --rollout governance/policy/rollout.json
          --max-attempts 3
          --output "$RUNNER_TEMP/pr-review-evidence.json"
          --run-id "${{ github.run_id }}"
          --enable-auto-merge
          --comment
      - name: Export post-gate merge eligibility
        id: eligibility
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path=Path('${{ runner.temp }}/pr-review-evidence.json')
          eligible=False
          if path.exists():
              data=json.loads(path.read_text())
              eligible=bool(data.get('autoMergeEligible'))
          print('merge=' + ('true' if eligible else 'false'))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr-review-evidence
          path: |
            ${{ runner.temp }}/pr-review-evidence.json
            ${{ runner.temp }}/manual-approval.json
          if-no-files-found: warn
          retention-days: 90

  merge:
    name: Portfolio Evidence Gate / merge
    needs: evidence
    if: needs.evidence.outputs.merge_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify post-gate merge state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          pr = os.environ['PR_NUMBER']
          expected = os.environ['EXPECTED_HEAD']
          raw = subprocess.check_output(['gh','pr','view',pr,'-R',repo,'--json','headRefOid,baseRefOid,mergeable,mergeStateStatus'], text=True)
          data = json.loads(raw)
          if data['headRefOid'] != expected:
              raise SystemExit('head changed after gate verification')
          if data['mergeable'] != 'MERGEABLE' or data['mergeStateStatus'] not in {'CLEAN', 'BLOCKED'}:
              raise SystemExit(f'unmergeable post-gate state: {data}')
          PY
      - name: Squash merge the exact verified head
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr merge "${{ inputs.pr_number }}"
          -R "${{ github.repository }}"
          --squash
          --match-head-commit "${{ inputs.head_sha }}"
