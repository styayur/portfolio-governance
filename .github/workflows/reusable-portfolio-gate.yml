name: Portfolio Evidence Gate

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      central_sha:
        required: true
        type: string

permissions:
  actions: read
  checks: write
  contents: write
  issues: write
  pull-requests: write
  security-events: read
  statuses: read

concurrency:
  group: portfolio-gate-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  classify:
    name: Portfolio Evidence Gate / risk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: styayur/portfolio-governance
          ref: ${{ inputs.central_sha }}
          path: governance
          persist-credentials: false
      - name: Classify pull request risk from exact diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 governance/scripts/risk_classify.py
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr_number }}"
          --context "$RUNNER_TEMP/pr-context.json"
          --output "$RUNNER_TEMP/risk.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: risk-evidence
          path: |
            ${{ runner.temp }}/pr-context.json
            ${{ runner.temp }}/risk.json
          if-no-files-found: error
          retention-days: 30

  review:
    name: Portfolio Evidence Gate / review
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: styayur/portfolio-governance
          ref: ${{ inputs.central_sha }}
          path: governance
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: risk-evidence
          path: ${{ runner.temp }}/risk
      - name: Independently review diff and policy
        run: >-
          python3 governance/scripts/independent_review.py
          --context "$RUNNER_TEMP/risk/pr-context.json"
          --risk "$RUNNER_TEMP/risk/risk.json"
          --output "$RUNNER_TEMP/review.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: independent-review
          path: ${{ runner.temp }}/review.json
          if-no-files-found: error
          retention-days: 30

  evidence:
    name: Portfolio Evidence Gate / verify
    needs: [classify, review]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
      security-events: read
      statuses: read
    outputs:
      merge_eligible: ${{ steps.eligibility.outputs.merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: styayur/portfolio-governance
          ref: ${{ inputs.central_sha }}
          path: governance
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: risk-evidence
          path: ${{ runner.temp }}/risk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: independent-review
          path: ${{ runner.temp }}/review
      - name: Verify exact head and apply merge policy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_TIMEOUT_SECONDS: '2700'
          GATE_POLL_SECONDS: '15'
        run: >-
          python3 governance/scripts/evidence_gate.py
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr_number }}"
          --head-sha "${{ inputs.head_sha }}"
          --risk "$RUNNER_TEMP/risk/risk.json"
          --review "$RUNNER_TEMP/review/review.json"
          --output "$RUNNER_TEMP/pr-review-evidence.json"
          --run-id "${{ github.run_id }}"
          --enable-auto-merge
          --comment
      - name: Export post-gate merge eligibility
        id: eligibility
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path=Path('${{ runner.temp }}/pr-review-evidence.json')
          eligible=False
          if path.exists():
              data=json.loads(path.read_text())
              eligible=bool(data.get('autoMergeEligible'))
          print('merge=' + ('true' if eligible else 'false'))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr-review-evidence
          path: ${{ runner.temp }}/pr-review-evidence.json
          if-no-files-found: warn
          retention-days: 90

  merge:
    name: Portfolio Evidence Gate / merge
    needs: evidence
    if: needs.evidence.outputs.merge_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash merge the exact verified head
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr merge "${{ inputs.pr_number }}"
          -R "${{ github.repository }}"
          --squash
          --match-head-commit "${{ inputs.head_sha }}"
