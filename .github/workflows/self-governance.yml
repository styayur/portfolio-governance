name: Governance self-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate policy and executable scripts
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m pytest -q
          python3 -m compileall -q scripts tests
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          labels=json.loads(Path('policy/labels.json').read_text())['labels']
          names=[item['name'] for item in labels]
          assert len(names)==len(set(names))
          discussions=json.loads(Path('policy/discussions.json').read_text())['categories']
          assert {'General','Ideas','Q&A','Announcements'} <= {item['name'] for item in discussions}
          PY

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile Python sources
        run: python3 -m compileall -q scripts tests

  security:
    name: security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit development dependencies
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m pip_audit --strict -r requirements-dev.txt
