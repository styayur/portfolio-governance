name: Portfolio project sync

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Hourly sync is intentional: keep Portfolio Project state aligned with live PR/Issue/risk records.
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.PORTFOLIO_APP_CLIENT_ID }}
          private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
          owner: styayur
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-repository-projects: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Mirror live public work into Styayur Portfolio
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PORTFOLIO_PROJECT_TOKEN: ${{ secrets.PORTFOLIO_PROJECT_TOKEN }}
          PORTFOLIO_PROJECT_ID: PVT_kwHOE1hmpc4BoN2B
        run: python3 scripts/project_sync.py
      # Artifact name contract: consumed by final-acceptance.yml.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: portfolio-project-sync-${{ github.run_id }}
          path: evidence/baseline/portfolio-project-sync.json
          if-no-files-found: warn
          retention-days: 90
