# Reusable gate for this repository.
# Replace 999a886a1437f15b50fd59d75351d98bf017b627 with the reviewed portfolio-governance commit SHA.
name: Portfolio Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions:
  actions: read
  checks: write
  contents: read
  issues: write
  pull-requests: write
  security-events: read
  statuses: read

jobs:
  portfolio:
    uses: styayur/portfolio-governance/.github/workflows/reusable-portfolio-gate.yml@999a886a1437f15b50fd59d75351d98bf017b627
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      central_sha: 999a886a1437f15b50fd59d75351d98bf017b627
