name: Portfolio final acceptance

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Governance self-checks]
    types: [completed]
  schedule:
    - cron: '13 3 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: portfolio-final-acceptance
  cancel-in-progress: false

jobs:
  snapshot:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 50
    steps:
      - name: Resolve exact target SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            test -n "$EVENT_SHA"
            printf 'sha=%s\n' "$EVENT_SHA" >> "$GITHUB_OUTPUT"
          else
            sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
            test -n "$sha"
            printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - name: Wait for all related workflows on the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: >-
          python3 scripts/wait_for_workflows.py
          --repo "$REPO"
          --sha "$TARGET_SHA"
          --workflows "Governance self-checks,Portfolio audit,Portfolio project sync,Portfolio risk operations"
          --events "push,schedule,workflow_dispatch"
          --timeout 1800
          --output evidence/final/workflow-completion.json
      - name: Recheck target is still current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          current="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$TARGET_SHA"
      - name: Materialize exact-SHA workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/collect_workflow_artifacts.py
          --repo "${{ github.repository }}"
          --completion evidence/final/workflow-completion.json
          --output evidence/final/workflow-artifacts.json
      - name: Build final evidence after all workflows completed
        env:
          GH_TOKEN: ${{ github.token }}
          PORTFOLIO_PROJECT_TOKEN: ${{ secrets.PORTFOLIO_PROJECT_TOKEN }}
        run: python3 scripts/build_final_evidence.py
      - name: Verify acceptance status consistency
        run: python3 scripts/verify_final_acceptance.py --path evidence/final/final-acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: portfolio-final-acceptance-${{ github.run_id }}
          path: |
            evidence/final/
            evidence/risk/
            evidence/remediation/
          if-no-files-found: warn
          retention-days: 90
