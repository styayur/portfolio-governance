name: Seal approved agentic bootstrap secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    if: github.repository == 'styayur/portfolio-governance' && github.ref == 'refs/heads/main' && github.actor_id == '324560549' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install standard GitHub secret encryption library before loading credentials
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r automation/bootstrap/sealing-requirements.txt
      - name: Seal only to the reviewed repository public keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PORTFOLIO_AI_REVIEW_API_KEY: ${{ secrets.PORTFOLIO_AI_REVIEW_API_KEY }}
        run: python automation/scripts/seal_agentic_bootstrap_secrets.py
      - name: Export GitHub-targeted ciphertext only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-agentic-secrets-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed-agentic-secrets.json
          if-no-files-found: error
          retention-days: 1
